apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: async-pipeline
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      enableServiceLinks: false
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:latest
          ports:
            - containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: "redis://redis:6379"
            - name: REDIS_EXPORTER_CHECK_KEYS
              value: "celery"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter-svc
  namespace: async-pipeline
  labels:
    app: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: 9121