apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: async-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      enableServiceLinks: false
      containers:
        - name: flower
          image: mher/flower:2.0
          command:
            - "celery"
            - "--broker=redis://redis:6379/0"
            - "flower"
            - "--port=5555"
            - "--address=0.0.0.0"
          ports:
            - containerPort: 5555
---
apiVersion: v1
kind: Service
metadata:
  name: flower-svc
  namespace: async-pipeline
spec:
  selector:
    app: flower
  ports:
    - port: 5555
      targetPort: 5555